<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>AI Hedge Fund OS - Trợ lý</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --bubble-user: #2b6cb0;
    --bubble-ai: #232733;
    --text: #e6e8ee;
    --accent: #7c9cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; align-items: center; justify-content: center;
    height: 100vh;
  }
  .app {
    width: 420px; height: 640px; background: var(--panel);
    border-radius: 20px; display: flex; flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5); overflow: hidden;
  }
  .header {
    display: flex; align-items: center; gap: 12px;
    padding: 16px; border-bottom: 1px solid #2a2e3a;
  }
  /* ---- KHU VỰC AVATAR: thay thế bằng nhân vật cute bạn tự thiết kế ----
     Cách 1: đổi background dưới đây thành ảnh: background-image: url('avatar.png');
     Cách 2: thay thẻ div.avatar bằng <img src="avatar.png" class="avatar"> */
  .avatar {
    width: 44px; height: 44px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #4c5fd5);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; animation: idle 2.4s ease-in-out infinite;
    flex-shrink: 0;
  }
  @keyframes idle {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-3px) scale(1.03); }
  }
  .avatar.thinking { animation: thinking 0.6s ease-in-out infinite; }
  @keyframes thinking {
    0%, 100% { transform: rotate(-4deg); }
    50% { transform: rotate(4deg); }
  }
  .title { font-weight: 600; font-size: 15px; }
  .subtitle { font-size: 12px; color: #8b90a0; }

  .messages {
    flex: 1; overflow-y: auto; padding: 16px; display: flex;
    flex-direction: column; gap: 10px;
  }
  .msg {
    max-width: 78%; padding: 10px 14px; border-radius: 14px;
    font-size: 14px; line-height: 1.45; white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end; background: var(--bubble-user);
    border-bottom-right-radius: 4px;
  }
  .msg.ai {
    align-self: flex-start; background: var(--bubble-ai);
    border-bottom-left-radius: 4px;
  }
  .msg.system {
    align-self: center; color: #8b90a0; font-size: 12px; background: none;
  }

  .input-bar {
    display: flex; gap: 8px; padding: 12px; border-top: 1px solid #2a2e3a;
  }
  .input-bar input {
    flex: 1; background: #10131a; border: 1px solid #2a2e3a;
    border-radius: 10px; padding: 10px 12px; color: var(--text); font-size: 14px;
  }
  .input-bar input:focus { outline: none; border-color: var(--accent); }
  .input-bar button {
    background: var(--accent); border: none; border-radius: 10px;
    padding: 0 18px; color: white; font-weight: 600; cursor: pointer;
  }
  .input-bar button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="avatar" id="avatar">🐾</div>
    <div>
      <div class="title">Trợ lý Quỹ AI</div>
      <div class="subtitle" id="statusText">Sẵn sàng</div>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="msg system">Hỏi mình về giá BTC/ETH/SOL hoặc tín hiệu AI mới nhất nhé!</div>
  </div>

  <div class="input-bar">
    <input id="userInput" type="text" placeholder="Nhập câu hỏi..." autocomplete="off">
    <button id="sendBtn">Gửi</button>
  </div>
</div>

<script>
  // ĐỔI URL NÀY nếu n8n chạy ở địa chỉ/port khác
  const WEBHOOK_URL = "http://localhost:5678/webhook-test/ai-chat";

  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("userInput");
  const sendBtn = document.getElementById("sendBtn");
  const avatarEl = document.getElementById("avatar");
  const statusEl = document.getElementById("statusText");

  function addMessage(text, cls) {
    const div = document.createElement("div");
    div.className = "msg " + cls;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;
    addMessage(text, "user");
    inputEl.value = "";
    sendBtn.disabled = true;
    avatarEl.classList.add("thinking");
    statusEl.textContent = "Đang suy nghĩ...";

    try {
      const res = await fetch(WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      addMessage(data.reply || "(không có phản hồi)", "ai");
    } catch (err) {
      addMessage("Lỗi kết nối tới trợ lý: " + err.message, "system");
    } finally {
      sendBtn.disabled = false;
      avatarEl.classList.remove("thinking");
      statusEl.textContent = "Sẵn sàng";
      inputEl.focus();
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage();
  });
</script>

</body>
</html>

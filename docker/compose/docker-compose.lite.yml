services:

  postgres:
    image: postgres:16-alpine
    container_name: aiqrp-postgres

    restart: unless-stopped

    env_file:
      - ../.env

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

    mem_limit: 256m

    networks:
      - aiqrp

  n8n:
    image: n8nio/n8n:1.92.2

    container_name: aiqrp-n8n

    restart: unless-stopped

    ports:
      - "5678:5678"

    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=quant
      - DB_POSTGRESDB_USER=ai
      - DB_POSTGRESDB_PASSWORD=ai123

      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http

      - GENERIC_TIMEZONE=Asia/Ho_Chi_Minh
      - TZ=Asia/Ho_Chi_Minh

      - N8N_ENCRYPTION_KEY=CHANGE_THIS_TO_A_LONG_RANDOM_STRING_123456789

      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true

      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168

      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false

      - NODE_OPTIONS=--max-old-space-size=768

    depends_on:
      - postgres

    mem_limit: 1g

    networks:
      - aiqrp

volumes:
  postgres_data:

networks:
  aiqrp:
    driver: bridge